// cyber_node_override.cpp
#include <rclcpp/rclcpp.hpp>
#include <geometry_msgs/msg/twist.hpp>

class CyberOverrideNode : public rclcpp::Node {
public:
    CyberOverrideNode() : Node("cyber_override_node") {
        publisher_ = this->create_publisher<geometry_msgs::msg/Twist>("/cmd_vel", 10);
        RCLCPP_INFO(this->get_logger(), "[+] Autonomous navigation node online. Overriding manual teleop...");
    }
private:
    rclcpp::Publisher<geometry_msgs::msg/Twist>::SharedPtr publisher_;
};

int main(int argc, char **argv) {
    rclcpp::init(argc, argv);
    rclcpp::spin(std::make_shared<CyberOverrideNode>());
    rclcpp::shutdown();
    return 0;
}
